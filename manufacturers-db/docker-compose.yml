services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manufacturers}
      POSTGRES_USER: ${POSTGRES_USER:-mdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mdb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdb} -d ${POSTGRES_DB:-manufacturers}"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mdb_pgdata:
